name: Netlify Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check website
        run: |
          echo "Checking website files..."
          test -f index.html
          echo "index.html found successfully."
          echo "Netlify will handle the deployment."
