name: SADEE SOLUTIONS - Extract & Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sadee-solutions-build
  cancel-in-progress: true
jobs:
  build:
    name: Extract Website & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare dist
        run: |
          set -e
          rm -rf dist
          mkdir -p dist
      - name: Extract ZIP or use repository files
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d dist
          else
            echo "No root ZIP found; copying website files."
            cp index.html styles.css app.js config.js dist/
            cp -r assets dist/ 2>/dev/null || true
            cp -r admin dist/ 2>/dev/null || true
          fi
      - name: Flatten website folder
        shell: bash
        run: |
          set -e
          INDEX=$(find dist -type f -name index.html | head -n 1)
          test -n "$INDEX"
          D=$(dirname "$INDEX")
          if [ "$D" != "dist" ]; then
            find "$D" -mindepth 1 -maxdepth 1 -exec mv {} dist/ \;
            find dist -mindepth 1 -type d -empty -delete || true
          fi
      - name: Disable mobile pinch zoom
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          tag='<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">'
          for p in [Path('dist/index.html'),Path('dist/admin/index.html')]:
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            s=re.sub(r'<meta\s+name=["\']viewport["\'][^>]*>',tag,s,count=1,flags=re.I)
            p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          set -e
          test -f dist/index.html
          test -f dist/admin/index.html
          echo "Website build OK"
          find dist -maxdepth 3 -type f | sort
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sadee-solutions-website
          path: dist
          if-no-files-found: error
          retention-days: 7
